<title>Registro Giornate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: registro da campo a colonna singola — riepilogo del mese, poi giornate raggruppate per settimana con barra oraria 5–23 */
:root {
  --bg: #F2F4EF; --surface: #FFFFFF; --ink: #17201A; --muted: #5D6A60; --line: #DAE0D6;
  --accent: #2E6A3E; --accent-soft: #E1EDE2;
  --bark: #8B5A2B; --shop: #3F6688; --other: #A3ACA4; --road: #C7A04A;
  --warn: #9A5B12; --warn-soft: #F6EAD6; --crit: #B3261E; --crit-soft: #F8E1DE;
  --p0: #C2410C; --p1: #7C3AED; --p2: #BE185D; --p3: #0E7490;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1411; --surface: #171E19; --ink: #E4EBE3; --muted: #97A499; --line: #29332B;
  --accent: #74C08A; --accent-soft: #1F3326; --bark: #CB9260; --shop: #7EA6CB; --other: #5F6B61; --road: #D8B663;
  --warn: #E2A75A; --warn-soft: #33281A; --crit: #F2867D; --crit-soft: #3A1F1C; --p0: #FB923C; --p1: #A78BFA; --p2: #F472B6; --p3: #22D3EE; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1411; --surface: #171E19; --ink: #E4EBE3; --muted: #97A499; --line: #29332B;
  --accent: #74C08A; --accent-soft: #1F3326; --bark: #CB9260; --shop: #7EA6CB; --other: #5F6B61; --road: #D8B663;
  --warn: #E2A75A; --warn-soft: #33281A; --crit: #F2867D; --crit-soft: #3A1F1C; --p0: #FB923C; --p1: #A78BFA; --p2: #F472B6; --p3: #22D3EE; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 28px 64px; display: flex; flex-direction: column; gap: 28px }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em }
h1 { font-size: 1.9rem; font-weight: 700 }
h2 { font-size: 1.2rem; font-weight: 700 }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
button, select, input { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px }
header.top p { margin: 4px 0 0; color: var(--muted); max-width: 52ch }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px }
@media (max-width: 520px) { .top-right, .tabs { width: 100% } .tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) } .tabs button { padding: 6px 2px !important; font-size: .78rem } }
.tabs button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; color: var(--muted); font-weight: 500 }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink) }
.tabs .ti { display: none }
/* telefono: barra in alto compatta e schede in basso, come un'app */
@media (max-width: 700px) {
  .wrap { padding-block: 0 calc(92px + env(safe-area-inset-bottom, 0px)); gap: 22px }
  header.top { position: sticky; top: 0; z-index: 20; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-inline: -16px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
    background: var(--bg); border-bottom: 1px solid var(--line) } /* niente blur qui: farebbe "agganciare" la barra in basso all'intestazione */
  header.top > div:first-child { flex: 1 1 0; min-width: 0 }
  .io { flex: none }
  header.top > div:first-child > .label, header.top p { display: none }
  header.top h1 { font-size: 1.3rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  .top-right { display: contents !important }
  .io { flex-direction: row !important; align-items: center; gap: 6px }
  .io .label { display: none }
  .io select { padding: 6px 28px 6px 12px; border-radius: 999px; font-size: .9rem }
  .online { flex-basis: 100%; order: 5 }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; width: auto !important; display: grid !important; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0;
    border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
    background: color-mix(in srgb, var(--surface) 97%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px) }
  .tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0 !important; font-size: .68rem !important; font-weight: 600; background: none !important; color: var(--muted) }
  .tabs .ti { display: block; width: 44px; height: 28px; padding: 4px 12px; border-radius: 999px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
  .tabs button[aria-selected="true"] { color: var(--accent) }
  .tabs button[aria-selected="true"] .ti { background: var(--accent-soft) }
  .months { flex-wrap: nowrap !important; overflow-x: auto; margin-inline: -16px; padding: 2px 16px; scrollbar-width: none; -webkit-overflow-scrolling: touch }
  .months::-webkit-scrollbar { display: none }
  .months button { flex: none; white-space: nowrap }
}

.months { display: flex; gap: 6px; flex-wrap: wrap }
.months button { border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; border-radius: 999px; font-size: .9rem; text-transform: capitalize }
.months button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.stats > div { background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0 }
.stats .big { font-family: var(--f-display); font-size: 1.45rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15 }
.stats .big small { font-size: .95rem; font-weight: 500; color: var(--muted) }
@media (max-width: 620px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)) } }

#view { display: flex; flex-direction: column; gap: 28px }
.section { display: flex; flex-direction: column; gap: 12px }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .82rem; color: var(--muted) }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none }
.c-cliente { background: var(--accent) } .c-vivaio { background: var(--bark) } .c-acquisti { background: var(--shop) }
.c-altro { background: repeating-linear-gradient(135deg, var(--other) 0 3px, transparent 3px 6px); box-shadow: inset 0 0 0 1px var(--other) }
.c-road { background: var(--road); height: 3px; border-radius: 2px; width: 14px }

table.places { width: 100%; border-collapse: collapse; font-size: .93rem }
table.places td, table.places th { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle }
table.places th { font-weight: 600; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
table.places td.r, table.places th.r { text-align: right }
.tbl { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px }
.pname { display: flex; align-items: center; gap: 8px; min-width: 0 }
.pname b { font-weight: 600 }

.week { display: flex; flex-direction: column; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.week-head { display: flex; justify-content: space-between; gap: 12px; padding: 10px 16px; background: var(--accent-soft); font-size: .88rem }
.week-head b { font-family: var(--f-display) }
.day { border-top: 1px solid var(--line) }
.day:first-of-type { border-top: 0 }
.day-row { display: grid; grid-template-columns: 6.2rem 7.6rem minmax(0, 1fr) 6.4rem; gap: 12px; align-items: center; width: 100%; padding: 10px 16px; background: none; border: 0; text-align: left }
.day-row:hover { background: color-mix(in srgb, var(--accent-soft) 45%, transparent) }
.day-date { font-weight: 600; text-transform: capitalize }
.day-date small { display: block; font-weight: 400; color: var(--muted); font-size: .8rem }
.day-span { font-family: var(--f-mono); font-size: .86rem; font-variant-numeric: tabular-nums }
.day-tot { font-family: var(--f-mono); text-align: right; font-weight: 500; font-variant-numeric: tabular-nums }
.day.off .day-tot { color: var(--muted); text-decoration: line-through }
.bar { position: relative; height: 20px; border-radius: 4px; background:
  repeating-linear-gradient(90deg, transparent 0 calc(100%/18 - 1px), var(--line) calc(100%/18 - 1px) calc(100%/18)); }
.bar .road { position: absolute; top: 9px; height: 2px; background: var(--road); border-radius: 1px }
.bar .stop { position: absolute; top: 2px; bottom: 2px; border-radius: 3px; min-width: 2px }
.bar .off { opacity: .28 }
.bar.multi { background: none; height: auto; display: flex; flex-direction: column; gap: 2px }
.lane { display: block }
.lane-bar { display: block }
.lane-name b { color: var(--ink); font-weight: 600 }
.lane-name { display: flex; align-items: center; gap: 2px; font-size: .72rem; color: var(--muted); line-height: 1.3; white-space: nowrap; overflow: hidden }
.lane-name i { margin-left: 4px } .lane-name i:first-child { margin-left: 0 }
.bar .with { position: absolute; top: 9px; height: 0; border-top: 2px dotted var(--accent); opacity: .7 }
.bar .band { position: absolute; top: -1px; bottom: -1px; background: var(--accent-soft); border-top: 1px dashed var(--accent); border-bottom: 1px dashed var(--accent) }
.pdot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; margin-right: 3px; vertical-align: 0 }
.who.multi { display: flex; flex-wrap: wrap; gap: 0 8px; color: var(--muted); font-weight: 500 }
.who.multi b { color: var(--ink); font-weight: 600 }
.person-head { display: flex; align-items: center; gap: 6px; font-weight: 700; margin: 14px 0 6px }
.person-head:first-child { margin-top: 4px }
.chi-tag { display: inline-flex; align-items: center; margin-right: 8px; font-weight: 600 }
ol.legs li.split-mark { list-style: none; margin: 6px 0; padding: 4px 10px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: .85rem; display: block }
ol.legs li.branch { list-style: none; display: block; margin: 4px 0 4px 6px; padding: 4px 0 4px 10px; border-left: 3px solid var(--bc) }
.branch-head { font-size: .85rem; margin-bottom: 4px }
.branch .legs { margin: 0; padding: 0 }
.axis { display: grid; grid-template-columns: 6.2rem 7.6rem minmax(0, 1fr) 6.4rem; gap: 12px; padding: 6px 16px 0; font-size: .7rem; color: var(--muted); font-family: var(--f-mono) }
.axis .ticks { display: flex; justify-content: space-between }
@media (max-width: 620px) {
  .day-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "d t" "s s" "b b"; row-gap: 6px }
  .day-row .day-date { grid-area: d } .day-row .day-span { grid-area: s } .day-row .bar { grid-area: b } .day-row .day-tot { grid-area: t }
  .day-date small { display: inline; margin-left: 6px }
  .axis { display: none }
}

.detail { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 14px }
.outing { border: 1px solid var(--line); border-radius: 10px; overflow: hidden }
.outing-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bg) }
.pill { font-size: .75rem; padding: 2px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font-weight: 600 }
.pill.ok { background: var(--accent-soft); color: var(--accent) }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: .88rem; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px 3px 4px }
.toggle i { width: 28px; height: 16px; border-radius: 999px; background: var(--other); position: relative; transition: background .15s }
.toggle i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); transition: transform .15s }
.toggle[aria-checked="true"] i { background: var(--accent) }
.toggle[aria-checked="true"] i::after { transform: translateX(12px) }
ol.legs { list-style: none; margin: 0; padding: 4px 12px 8px }
ol.legs li { display: grid; grid-template-columns: 6.4rem minmax(0, 1fr); gap: 10px; padding: 6px 0; align-items: start }
ol.legs li.leg { color: var(--muted); font-size: .84rem; padding: 0 }
ol.legs li.leg .t { text-align: left }
ol.legs li.leg span:last-child { border-left: 2px dotted var(--road); padding-left: 10px; margin-left: 5px }
ol.legs .t { font-family: var(--f-mono); font-size: .84rem; font-variant-numeric: tabular-nums }
.stop-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-width: 0 }
.stop-line .nm { font-weight: 600 }
.stop-line .du { font-family: var(--f-mono); font-size: .84rem; color: var(--muted) }
.home-line { font-weight: 600; color: var(--muted) }
a.maps { font-size: .8rem; color: var(--accent); text-decoration: none; white-space: nowrap }
a.maps:hover { text-decoration: underline }
.linkish { border: 0; background: none; color: var(--accent); padding: 0; font-size: .8rem }
.linkish:hover { text-decoration: underline }

.editor { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; width: 100% }
.editor input { flex: 1 1 12rem; min-width: 0; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface) }
.editor select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface) }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 8px; padding: 7px 14px; font-weight: 600 }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line) }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px }
.card ol { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 4px; max-width: 62ch }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 24px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center }
.drop.over { border-color: var(--accent); background: var(--accent-soft) }
.status { font-size: .9rem }
.empty { padding: 36px 20px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px }
.notice { padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: .9rem }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 12px }
.field { display: flex; flex-direction: column; gap: 4px }
.field input { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface) }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: .8rem; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--ink) }
.chip .x { border: 0; background: none; color: var(--muted); padding: 0 0 0 4px; font-size: 1rem; line-height: 1 }
.chip .x:hover { color: var(--warn) }
.work-box { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 8px 8px 0 }
.nota { margin: 0; font-size: .9rem; white-space: pre-wrap; overflow-wrap: anywhere }
ol.legs li.work { padding-top: 0 }
.lav-form { display: flex; flex-direction: column; gap: 10px; min-width: 0; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg) }
.lav-form .row { display: flex; gap: 8px; flex-wrap: wrap }
.lav-form input[name="nuova"], .lav-form textarea { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font: inherit; resize: vertical }
label.check { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; padding: 4px 11px 4px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; user-select: none }
label.check input { accent-color: var(--accent); margin: 0 }
label.check:has(input:checked) { background: var(--accent-soft); border-color: var(--accent) }
tr.hist > td { background: var(--bg) }
.hist-box { display: flex; flex-direction: column; gap: 12px; padding: 4px 0 }
.hist-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px }
.hist-list li { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 10px; align-items: start; font-size: .9rem }
.hist-list .mono { font-size: .8rem; text-transform: capitalize }
@media (max-width: 620px) { .hist-list li { grid-template-columns: minmax(0, 1fr) } }
.tel { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: .92rem }
.tel .mono { user-select: all; font-weight: 500 }
details.lontane > summary { cursor: pointer; list-style: none }
details.lontane > summary::-webkit-details-marker { display: none }
details.lontane > summary h2::after { content: " ▸"; color: var(--muted) }
details.lontane[open] > summary h2::after { content: " ▾" }
.done-bar { display: flex; flex-wrap: wrap; align-items: end; gap: 8px; padding: 6px 8px; border: 1px dashed var(--line); border-radius: 10px; background: var(--bg) }
.done-check { font-weight: 600 }
.oggi-head { flex-direction: row !important; justify-content: space-between; align-items: end; flex-wrap: wrap }
.oggi-title { font-size: 1.7rem; text-transform: capitalize }
.item.mine { box-shadow: inset 3px 0 0 var(--accent) }
.linkname { border: 0; background: none; padding: 0; font: inherit; font-weight: 600; color: var(--ink); display: inline-flex; align-items: center; gap: 8px; text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px }
.linkname:hover { text-decoration-color: var(--accent) }
.small-chips { font-size: .78rem; color: var(--muted); margin-top: 2px }
tr.totrow td { background: var(--bg) }
.field textarea { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font: inherit; resize: vertical }
.online { display: flex; flex-direction: column; gap: 3px; min-width: 0 }
.online[hidden] { display: none }
.online-list { display: flex; flex-wrap: wrap; gap: 4px }
.who-chip { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; padding: 3px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line) }
.who-chip i { width: 7px; height: 7px; border-radius: 50%; background: #2fae5b; flex: none }
.who-chip.me { background: var(--accent-soft) }
button.who-chip { cursor: pointer; font: inherit; font-size: .8rem; color: var(--ink) }
button.who-chip[aria-expanded="true"] { border-color: var(--accent) }
.pop-acc { margin-top: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; max-width: 22rem; box-shadow: 0 6px 18px rgba(0,0,0,.08) }
.pop-head { display: flex; justify-content: space-between; align-items: center; gap: 8px }
.pop-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px }
.pop-grid div { display: flex; flex-direction: column }
.pop-grid b { font-size: 1.25rem; font-family: var(--f-display) }
.who-chip small { color: var(--muted) }
table.places td.num, table.places td.r, .day-tot, .week-head b, .stats .big { white-space: nowrap }
@media (max-width: 620px) { .stats .big { font-size: 1.25rem } }
.rain-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 14px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: .9rem }
.rain-add { display: inline-flex; gap: 6px; align-items: center }
.rain-add input { padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font: inherit; font-size: .88rem }
.rain-sw { display: flex }
.day.rain .day-row { cursor: default }
.rain-ico { font-size: .95em }
.add-man { align-self: flex-start }
.corr-form { display: grid; gap: 8px; margin-top: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); width: 100% }
.corr-form select { width: 100% }
.pos-box { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 10px; background: var(--bg) }
.oggi-btns { display: flex; flex-wrap: wrap; gap: 8px }

<script>
/* Motore: dalla Cronologia (iPhone o Android) alle uscite da casa, raggruppate per giorno. */
const Engine = (() => {
  const TZ = "Europe/Rome";
  const MIN_SOSTA_MIN = 3;        // soste più brevi = semafori / code, ignorate
  const ORA_SERALE = 19;          // uscite che iniziano da quest'ora = serali (non lavoro di default)
  const ORE_TRASFERTA = 20;       // uscite più lunghe = viaggio / vacanza
  const KM_ZONA = 60;             // soste oltre questa distanza da casa = fuori zona

  function geo(v) {
    if (!v) return null;
    const s = typeof v === "string" ? v : (v.latLng || "");
    const m = /(-?\d+(?:\.\d+)?)°?\s*,\s*(-?\d+(?:\.\d+)?)/.exec(s);
    return m ? { lat: +m[1], lng: +m[2] } : null;
  }
  function dist(a, b) {
    const R = 6371000, r = Math.PI / 180;
    const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  const dateFmt = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
  const hourFmt = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false });
  const localDate = (ms) => dateFmt.format(new Date(ms));
  const localHour = (ms) => { const [h, m] = hourFmt.format(new Date(ms)).split(":").map(Number); return h + m / 60; };

  function visits(raw) {
    const arr = Array.isArray(raw) ? raw : (raw && (raw.semanticSegments || raw.timelineObjects)) || [];
    const out = [];
    for (const x of arr) {
      const v = x.visit;
      if (!v || !v.topCandidate) continue;
      if (String(v.hierarchyLevel ?? "0") !== "0") continue;
      const p = geo(v.topCandidate.placeLocation);
      const s = Date.parse(x.startTime), e = Date.parse(x.endTime);
      if (!p || !(e > s)) continue;
      out.push({ s, e, pid: String(v.topCandidate.placeID || `p${p.lat.toFixed(5)}_${p.lng.toFixed(5)}`).replace(/[^A-Za-z0-9_\-.~:@+]/g, "_"), lat: p.lat, lng: p.lng, tipo: v.topCandidate.semanticType || "" });
    }
    out.sort((a, b) => a.s - b.s);
    return out;
  }

  function moves(raw) {
    const arr = Array.isArray(raw) ? raw : (raw && raw.semanticSegments) || [];
    return arr.filter((x) => x.activity).map((x) => ({ s: Date.parse(x.startTime), e: Date.parse(x.endTime) }))
      .filter((a) => a.e > a.s && a.e - a.s < 6 * 3.6e6).sort((a, b) => a.s - b.s);
  }

  /** Trova la casa: la posizione dove si passano più notti. */
  function guessHome(vs) {
    const tally = new Map();
    for (const v of vs) {
      if (v.tipo === "Home" || v.tipo === "INFERRED_HOME" || v.tipo === "HOME") {
        const k = v.pid; const t = tally.get(k) || { ...v, h: 0 }; t.h += (v.e - v.s); tally.set(k, t);
      }
    }
    let best = null; for (const t of tally.values()) if (!best || t.h > best.h) best = t;
    return best ? { lat: best.lat, lng: best.lng, raggio: 200 } : null;
  }

  /** Divide la cronologia in uscite: dall'uscita di casa al rientro. */
  function process(raw, home) {
    const vs = visits(raw);
    if (!home) home = guessHome(vs);
    if (!home) throw new Error("casa");
    const isHome = (v) => dist(v, home) <= (home.raggio || 200);
    const uscite = [];
    let lastHomeEnd = null, stops = [];
    const acts = moves(raw);
    const close = (end, rientro) => {
      const clean = mergeStops(stops);
      if (!clean.length) { stops = []; return; }
      const first = clean[0], last = clean[clean.length - 1];
      let inizio = lastHomeEnd, fine = end;
      let pNota = inizio != null && !coversNight(inizio, first.s);
      let rNota = rientro && fine != null && !coversNight(last.e, fine);
      // partenza o rientro mancanti: uso il tragitto registrato subito prima/dopo
      if (!pNota) { const a = acts.filter((a) => a.e <= first.s + 60000 && a.e >= first.s - 30 * 60000).pop(); inizio = a ? a.s : first.s; }
      if (!rNota) { const a = acts.find((a) => a.s >= last.e - 60000 && a.s <= last.e + 30 * 60000); fine = a ? a.e : last.e; }
      uscite.push({ inizio, fine, partenzaNota: pNota, rientroNoto: rNota, soste: clean });
      stops = [];
    };
    const coversNight = (a, b) => (b - a) >= 5 * 3.6e6 && localDate(a) !== localDate(b) || (b - a) >= 5 * 3.6e6 && localHour(a) < 3 && localHour(b) > 4;
    let prevEnd = null;
    for (const v of vs) {
      if (isHome(v)) {
        if (stops.length) close(v.s, true);
        lastHomeEnd = v.e;
      } else if (coversNight(v.s, v.e)) {
        // notte passata altrove: vale come rientro e nuova partenza
        if (stops.length) close(v.s, false);
        lastHomeEnd = null; stops = [];
        prevEnd = v.e; continue;
      } else {
        if (stops.length && prevEnd != null && coversNight(prevEnd, v.s)) {
          // buco notturno senza dati: chiudo l'uscita alla sosta precedente
          close(null, false); lastHomeEnd = null;
        }
        stops.push(v);
      }
      prevEnd = v.e;
    }
    if (stops.length) close(null, false);

    const giorni = {};
    for (const u of uscite) {
      const d = localDate(u.inizio);
      const ore = (u.fine - u.inizio) / 3.6e6;
      const lontano = Math.max(...u.soste.map((x) => dist(x, home))) > KM_ZONA * 1000;
      const giaUscito = !!giorni[d];
      const h = localHour(u.inizio);
      u.auto = ore >= ORE_TRASFERTA ? "trasferta" : lontano ? "fuori zona"
        : (h >= ORA_SERALE || h < 5 || (giaUscito && h >= 18)) ? "serale" : "lavoro";
      u.distMax = Math.round(Math.max(...u.soste.map((x) => dist(x, home))));
      u.id = String(u.inizio);
      (giorni[d] ||= { data: d, uscite: [] }).uscite.push(u);
    }
    return { home, giorni: Object.values(giorni).sort((a, b) => a.data.localeCompare(b.data)) };
  }

  function mergeStops(list) {
    const out = [];
    for (const v of list) {
      const prev = out[out.length - 1];
      if (prev && (prev.pid === v.pid || dist(prev, v) < 60) && v.s - prev.e < 20 * 60000) {
        prev.e = Math.max(prev.e, v.e);
      } else out.push({ ...v });
    }
    return out.filter((v) => (v.e - v.s) >= MIN_SOSTA_MIN * 60000)
      .map(({ s, e, pid, lat, lng }) => ({ s, e, pid, lat: +lat.toFixed(6), lng: +lng.toFixed(6) }));
  }

  return { process, guessHome, visits, dist, localDate, localHour };
})();
if (typeof module !== "undefined") module.exports = Engine;

</script>

function oreClientiMese(mese) {
  const m = new Map();
  for (const g of giorniReali()) {
    if (!g.data.startsWith(mese)) continue;
    for (const u of usciteDi(g)) { if (!incluso(g, u)) continue;
      for (const s of sosteDi(u)) { const l = luogo(s); if (!l.named || l.cat !== "cliente") continue;
        const x = m.get(l.nome) || { nome: l.nome, min: 0, giorni: new Set(), lavori: new Set() };
        aggiungi(x, s); x.giorni.add(g.data);
        const w = S.lavori[lavKey(g.data, s.pid)]; if (w) (w.attivita || []).forEach((a) => x.lavori.add(a));
        m.set(l.nome, x); } }
  }
  return [...m.values()].sort((a, b) => b.min - a.min);
}
const mesiTutti = () => [...new Set(Object.values(S.giorni).map((g) => g.data.slice(0, 7)))].sort();
const meseNome = (m) => new Date(m + "-15T12:00:00").toLocaleDateString("it-IT", { month: "long", year: "numeric" });

        <label class="field"><span class="label">Manutenzione ogni</span><select id="sc-ogni" name="ogni">${[...new Set([...FREQ, ogni])].sort((a, b) => a - b).map((f) => `<option value="${f}" ${f === ogni ? "selected" : ""}>${f} giorni</option>`).join("")}</select></label>
        <label class="field"><span class="label">Telefono</span><input id="sc-tel" name="tel" type="tel" inputmode="tel" value="${esc(c.tel || "")}" placeholder="Es. 333 123 4567"></label>
        <label class="field"><span class="label">Indirizzo</span><input id="sc-ind" name="indirizzo" value="${esc(c.indirizzo || "")}" placeholder="Via, numero, paese"></label>
        <label class="field" style="grid-column:1/-1"><span class="label">Note fisse</span><textarea id="sc-note" name="note" rows="3" placeholder="Es. cancello con codice, cane in giardino, acqua dal rubinetto sul retro…">${esc(c.note || "")}</textarea></label>

async function esportaCsvClienti() {
  const st = document.getElementById("csvc-st");
  if (!dl) { st.textContent = "Il download non è disponibile in questa vista."; return; }
  const righe = oreClientiMese(S.meseC);
  const rows = [["Cliente", "Giorni", "Ore (h:mm)", "Date", "Lavori svolti"]];
  for (const x of righe) rows.push([x.nome, x.giorni.size, oreCsv(x.min), [...x.giorni].sort().map((d) => d.slice(8) + "/" + d.slice(5, 7)).join(", "), [...x.lavori].join(", ")]);
  const csv = "﻿" + rows.map((r) => r.map((c) => /[;"\n]/.test(String(c)) ? `"${String(c).replace(/"/g, '""')}"` : c).join(";")).join("\n");
  try { await dl.save({ filename: `ore-clienti-${S.meseC}.csv`, data: new Blob([csv], { type: "text/csv" }) }); st.textContent = ""; }
  catch { st.textContent = "Download annullato."; }
}
async function scaricaBackup() {

async function esportaCsv() {
  const st = document.getElementById("csv-st");
  if (!dl) { st.textContent = "Il download non è disponibile in questa vista."; return; }
  const rows = [["Data", "Persona", "Uscita", "Arrivo", "Partenza", "Luogo", "Categoria", "Minuti sul posto", "Minuti di strada prima", "Ore giornata (h:mm)", "Lavori", "Note"]];
  if (!S.mese) S.mese = "60";
  const days = giorniVisti().filter((g) => inPeriodo(g.data)).sort((a, b) => a.data.localeCompare(b.data));
  for (const g of days) { const sd = statDay(g); usciteDi(g).forEach((u, i) => { if (!incluso(g, u)) return; let prev = u.inizio;
    for (const s of sosteDi(u)) { const l = luogo(s);
      rows.push([g.data, nomeDi(g.persona), i + 1, hhmm(s.s), hhmm(s.e), l.nome, CATS[l.cat].label, Math.round((s.e - s.s) / 60000), Math.round((s.s - prev) / 60000), oreCsv(sd.fuori), ((S.lavori[lavKey(g.data, s.pid)] || {}).attivita || []).join(", "), (S.lavori[lavKey(g.data, s.pid)] || {}).nota || ""]); prev = s.e; }
    rows.push([g.data, nomeDi(g.persona), i + 1, hhmm(u.fine), "", "Rientro a casa", "", "", Math.round((u.fine - prev) / 60000), oreCsv(sd.fuori)]); }); }
  const csv = "﻿" + rows.map((r) => r.map((c) => /[;"\n]/.test(String(c)) ? `"${String(c).replace(/"/g, '""')}"` : c).join(";")).join("\n");
  try { await dl.save({ filename: `giornate-${PERIODI[S.mese] ? (S.mese === "60" ? "ultimi-2-mesi" : "tutto") : S.mese}-${vista()}.csv`, data: new Blob([csv], { type: "text/csv" }) }); st.textContent = ""; }
  catch (e) { st.textContent = "Download annullato."; }
}
